<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AV — AI Assistant</title>

  <style>

    /* =====================================================
       AV — CORE UI
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #02030a;

      --purple: #9b5cff;
      --purple2: #c77dff;
      --blue: #3d8bff;
      --cyan: #50d9ff;
      --pink: #ff5bea;

      --green: #55e6ad;

      --text: #ffffff;
      --muted: #8e8aa2;

      --border: rgba(155, 92, 255, 0.25);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* =====================================================
       BACKGROUND
    ===================================================== */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(100, 45, 255, 0.18),
          transparent 34%
        ),
        radial-gradient(
          circle at 50% 75%,
          rgba(40, 120, 255, 0.08),
          transparent 42%
        );

      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(100, 60, 255, 0.025),
          transparent
        );

      z-index: 0;
    }

    /* =====================================================
       MAIN
    ===================================================== */

    .dashboard {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      padding:
        18px
        16px
        30px;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-button {
      width: 54px;
      height: 54px;

      border-radius: 50%;

      border: 1px solid rgba(130, 120, 255, 0.28);

      background:
        radial-gradient(
          circle,
          rgba(60, 55, 120, 0.35),
          rgba(5, 7, 20, 0.8)
        );

      color: #ddd9ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 26px;

      box-shadow:
        0 0 20px rgba(90, 70, 255, 0.08);

      cursor: pointer;
    }

    .hamburger {
      font-size: 30px;
      line-height: 1;
    }

    .gear {
      font-size: 27px;
    }

    /* =====================================================
       AV TOP LOGO
    ===================================================== */

    .brand {
      text-align: center;
      margin-top: -3px;
    }

    .brand-logo {
      font-size: 42px;
      font-weight: 900;

      letter-spacing: 4px;

      background:
        linear-gradient(
          135deg,
          #7c43ff,
          #d477ff,
          #63cfff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow:
        0 0 20px rgba(160, 90, 255, 0.35);
    }

    .brand-subtitle {
      margin-top: -2px;

      font-size: 9px;
      letter-spacing: 5px;

      color: #aaa5c7;
    }

    /* =====================================================
       CORE AREA
    ===================================================== */

    .core-area {
      position: relative;

      width: 100%;
      height: 650px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* =====================================================
       CORE CENTER
    ===================================================== */

    .core-center {
      position: relative;

      width: 310px;
      height: 310px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(70, 35, 120, 0.55),
          rgba(10, 8, 30, 0.72) 48%,
          rgba(2, 3, 10, 0.95) 75%
        );

      border: 1px solid rgba(130, 100, 255, 0.18);

      box-shadow:
        0 0 35px rgba(90, 60, 255, 0.15),
        inset 0 0 55px rgba(120, 70, 255, 0.12);

      transition:
        transform 0.5s ease,
        box-shadow 0.5s ease,
        border-color 0.5s ease;

      animation:
        coreFloat 5s ease-in-out infinite;
    }

    /* =====================================================
       INNER GLOW
    ===================================================== */

    .core-center::before {
      content: "";

      position: absolute;

      width: 205px;
      height: 205px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(155, 92, 255, 0.34),
          rgba(70, 35, 150, 0.15) 48%,
          transparent 72%
        );

      filter: blur(10px);

      transition:
        background 0.5s ease,
        box-shadow 0.5s ease;
    }

    /* =====================================================
       MAIN CORE RINGS
    ===================================================== */

    .core-ring {
      position: absolute;

      border-radius: 50%;

      pointer-events: none;
    }

    .ring-1 {
      width: 175px;
      height: 175px;

      border:
        2px solid transparent;

      border-top-color: #c96cff;
      border-right-color: #814cff;

      box-shadow:
        0 0 15px rgba(177, 91, 255, 0.65);

      animation:
        rotateClockwise 6s linear infinite;
    }

    .ring-2 {
      width: 225px;
      height: 225px;

      border:
        2px solid transparent;

      border-left-color: #4c8fff;
      border-bottom-color: #9c5cff;

      box-shadow:
        0 0 18px rgba(60, 140, 255, 0.4);

      animation:
        rotateCounter 9s linear infinite;
    }

    .ring-3 {
      width: 270px;
      height: 270px;

      border:
        1px solid transparent;

      border-top-color: rgba(75, 215, 255, 0.75);
      border-bottom-color: rgba(199, 125, 255, 0.55);

      animation:
        rotateClockwise 14s linear infinite;
    }

    .ring-4 {
      width: 305px;
      height: 305px;

      border:
        1px solid rgba(120, 80, 255, 0.18);

      animation:
        rotateCounter 20s linear infinite;
    }

    /* =====================================================
       CORE INNER CIRCLE
    ===================================================== */

    .core-inner {
      position: relative;

      z-index: 10;

      width: 150px;
      height: 150px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 40% 35%,
          #493078,
          #160c32 58%,
          #090719
        );

      border:
        2px solid rgba(205, 117, 255, 0.85);

      box-shadow:
        0 0 25px rgba(177, 85, 255, 0.55),
        0 0 60px rgba(100, 50, 255, 0.22),
        inset 0 0 30px rgba(155, 92, 255, 0.22);

      animation:
        innerPulse 3s ease-in-out infinite;
    }

    /* =====================================================
       EXISTING AV LOGO
       KEEPING YOUR CURRENT LOGO SYSTEM
    ===================================================== */

    .core-logo {
      font-size: 48px;

      font-weight: 900;

      letter-spacing: 2px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #c77dff,
          #58cfff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow:
        0 0 20px rgba(183, 113, 255, 0.5);
    }

    /* =====================================================
       ORBIT PARTICLES
    ===================================================== */

    .particle {
      position: absolute;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #b878ff;

      box-shadow:
        0 0 10px #9b5cff;

      animation:
        particleFloat 4s ease-in-out infinite;
    }

    .p1 {
      top: 22%;
      left: 23%;
    }

    .p2 {
      top: 17%;
      right: 27%;

      animation-delay: 1s;
    }

    .p3 {
      bottom: 22%;
      left: 27%;

      animation-delay: 2s;
    }

    .p4 {
      bottom: 18%;
      right: 23%;

      animation-delay: 0.5s;
    }

    .p5 {
      top: 48%;
      left: 11%;

      animation-delay: 1.5s;
    }

    .p6 {
      top: 55%;
      right: 11%;

      animation-delay: 2.5s;
    }

    /* =====================================================
       STATUS
    ===================================================== */

    .ai-status {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      color: #d0cce0;

      font-size: 14px;

      letter-spacing: 4px;

      transition:
        color 0.4s ease;
    }

    .status-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 12px rgba(85, 230, 173, 0.95);

      animation:
        statusPulse 2s ease-in-out infinite;
    }

    .core-hint {
      margin-top: 12px;

      text-align: center;

      color: #747086;

      font-size: 13px;

      letter-spacing: 2px;
    }

    /* =====================================================
       BOTTOM CONTROL BAR
    ===================================================== */

    .control-bar {
      position: relative;

      display: flex;

      align-items: center;

      justify-content: space-between;

      width: 100%;

      max-width: 420px;

      height: 120px;

      margin: 52px auto 0;

      padding: 0 28px;

      border-radius: 70px;

      border:
        1px solid rgba(90, 90, 190, 0.55);

      background:
        linear-gradient(
          180deg,
          rgba(20, 24, 65, 0.9),
          rgba(8, 10, 30, 0.95)
        );

      box-shadow:
        0 0 30px rgba(70, 70, 255, 0.12),
        inset 0 0 25px rgba(100, 70, 255, 0.08);
    }

    .control-button {
      width: 62px;
      height: 62px;

      border-radius: 50%;

      border:
        1px solid rgba(100, 110, 255, 0.35);

      background:
        radial-gradient(
          circle,
          rgba(38, 43, 100, 0.9),
          rgba(13, 15, 42, 0.95)
        );

      color: #d9d9ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;

      cursor: pointer;

      box-shadow:
        0 0 15px rgba(80, 80, 255, 0.12);
    }

    /* =====================================================
       MAIN MICROPHONE
    ===================================================== */

    .mic {
      width: 92px;
      height: 92px;

      border-radius: 50%;

      border:
        2px solid rgba(203, 104, 255, 0.9);

      background:
        radial-gradient(
          circle,
          #4d2090,
          #170b3d 65%,
          #09051b
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;

      cursor: pointer;

      box-shadow:
        0 0 18px rgba(193, 82, 255, 0.9),
        0 0 45px rgba(126, 60, 255, 0.45);

      transition:
        transform 0.2s ease,
        box-shadow 0.3s ease;
    }

    .mic:active {
      transform: scale(0.92);
    }

    /* =====================================================
       STATE — LISTENING
    ===================================================== */

    .core-center.listening {
      border-color:
        rgba(80, 217, 255, 0.9);

      box-shadow:
        0 0 35px rgba(80, 217, 255, 0.65),
        0 0 85px rgba(61, 139, 255, 0.35),
        inset 0 0 45px rgba(80, 217, 255, 0.2);

      transform: scale(1.05);
    }

    .core-center.listening::before {
      background:
        radial-gradient(
          circle,
          rgba(50, 200, 255, 0.42),
          rgba(40, 80, 220, 0.18) 50%,
          transparent 72%
        );
    }

    .core-center.listening .ring-1 {
      border-top-color: #53e5ff;
      border-right-color: #328cff;

      animation-duration: 2.5s;
    }

    .core-center.listening .ring-2 {
      border-left-color: #50d9ff;
      border-bottom-color: #3d8bff;

      animation-duration: 4s;
    }

    .core-center.listening .ring-3 {
      border-top-color: #50d9ff;

      animation-duration: 6s;
    }

    /* =====================================================
       STATE — THINKING
    ===================================================== */

    .core-center.thinking {
      transform: scale(1.08);

      border-color:
        rgba(199, 125, 255, 0.95);

      box-shadow:
        0 0 35px rgba(180, 80, 255, 0.8),
        0 0 90px rgba(110, 50, 255, 0.4),
        inset 0 0 50px rgba(180, 80, 255, 0.25);
    }

    .core-center.thinking::before {
      background:
        radial-gradient(
          circle,
          rgba(190, 90, 255, 0.48),
          rgba(90, 30, 180, 0.18) 50%,
          transparent 75%
        );
    }

    .core-center.thinking .ring-1 {
      border-top-color: #f080ff;
      border-right-color: #9a45ff;

      animation-duration: 1.8s;
    }

    .core-center.thinking .ring-2 {
      border-left-color: #d36cff;
      border-bottom-color: #7345ff;

      animation-duration: 3s;
    }

    .core-center.thinking .ring-3 {
      border-top-color: #c77dff;
      border-bottom-color: #7c4dff;

      animation-duration: 5s;
    }

    /* =====================================================
       STATE — SPEAKING
    ===================================================== */

    .core-center.speaking {
      transform: scale(1.1);

      border-color:
        rgba(215, 115, 255, 1);

      box-shadow:
        0 0 40px rgba(215, 100, 255, 0.9),
        0 0 100px rgba(110, 50, 255, 0.45),
        inset 0 0 55px rgba(200, 100, 255, 0.3);

      animation:
        speakingPulse 0.9s ease-in-out infinite;
    }

    .core-center.speaking::before {
      background:
        radial-gradient(
          circle,
          rgba(225, 110, 255, 0.55),
          rgba(80, 100, 255, 0.18) 50%,
          transparent 75%
        );
    }

    .core-center.speaking .ring-1 {
      border-top-color: #ff9aff;
      border-right-color: #8c55ff;

      animation-duration: 1.3s;
    }

    .core-center.speaking .ring-2 {
      border-left-color: #61cfff;
      border-bottom-color: #c66cff;

      animation-duration: 2s;
    }

    .core-center.speaking .ring-3 {
      border-top-color: #e98cff;
      border-bottom-color: #5ecfff;

      animation-duration: 3.5s;
    }

    /* =====================================================
       STATE — REVEAL
    ===================================================== */

    .core-center.reveal {
      transform: scale(1.18);

      border-color:
        rgba(255, 91, 234, 1);

      box-shadow:
        0 0 45px rgba(255, 91, 234, 0.95),
        0 0 110px rgba(155, 70, 255, 0.7),
        inset 0 0 60px rgba(255, 91, 234, 0.35);

      animation:
        revealPulse 1.2s ease-in-out infinite;
    }

    .core-center.reveal::before {
      background:
        radial-gradient(
          circle,
          rgba(255, 90, 235, 0.6),
          rgba(155, 50, 255, 0.25) 50%,
          transparent 75%
        );
    }

    .core-center.reveal .ring-1 {
      border-top-color: #ff6bea;
      border-right-color: #b45cff;

      animation-duration: 1s;
    }

    .core-center.reveal .ring-2 {
      border-left-color: #ff7bdc;
      border-bottom-color: #824fff;

      animation-duration: 1.6s;
    }

    .core-center.reveal .ring-3 {
      border-top-color: #ff66e9;
      border-bottom-color: #8b5cff;

      animation-duration: 2.5s;
    }

    /* =====================================================
       STATE STATUS COLORS
    ===================================================== */

    .ai-status.listening {
      color: #65ddff;
    }

    .ai-status.thinking {
      color: #d18aff;
    }

    .ai-status.speaking {
      color: #ed9cff;
    }

    .ai-status.reveal {
      color: #ff8de9;
    }

    /* =====================================================
       ANIMATIONS
    ===================================================== */

    @keyframes coreFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes innerPulse {
      0%,
      100% {
        transform: scale(0.97);
      }

      50% {
        transform: scale(1.04);
      }
    }

    @keyframes speakingPulse {
      0%,
      100% {
        transform: scale(1.04);
      }

      50% {
        transform: scale(1.12);
      }
    }

    @keyframes revealPulse {
      0%,
      100% {
        transform: scale(1.08);
      }

      50% {
        transform: scale(1.2);
      }
    }

    @keyframes rotateClockwise {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateCounter {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    @keyframes particleFloat {
      0%,
      100% {
        transform:
          translateY(0)
          scale(0.8);

        opacity: 0.4;
      }

      50% {
        transform:
          translateY(-16px)
          scale(1.3);

        opacity: 1;
      }
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: 0.5;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 380px) {

      .core-area {
        height: 570px;
      }

      .core-center {
        transform: scale(0.86);
      }

      .core-center.listening {
        transform: scale(0.91);
      }

      .core-center.thinking {
        transform: scale(0.94);
      }

      .core-center.speaking {
        transform: scale(0.95);
      }

      .core-center.reveal {
        transform: scale(1);
      }

      .control-bar {
        height: 105px;
        padding: 0 20px;
      }

      .mic {
        width: 80px;
        height: 80px;
      }

      .control-button {
        width: 56px;
        height: 56px;
      }
    }

    @media (min-width: 700px) {

      .dashboard {
        max-width: 760px;
      }

      .core-area {
        height: 720px;
      }

      .core-center {
        transform: scale(1.15);
      }

      .core-center.listening {
        transform: scale(1.2);
      }

      .core-center.thinking {
        transform: scale(1.23);
      }

      .core-center.speaking {
        transform: scale(1.26);
      }

      .core-center.reveal {
        transform: scale(1.32);
      }
    }

  </style>
</head>


<body>

  <main class="dashboard">

    <!-- =================================================
         TOP BAR
    ================================================== -->

    <section class="top-bar">

      <button
        class="top-button hamburger"
        type="button"
        aria-label="Menu">
        ☰
      </button>


      <div class="brand">

        <div class="brand-logo">
          AV
        </div>

        <div class="brand-subtitle">
          AI ASSISTANT
        </div>

      </div>


      <button
        class="top-button gear"
        type="button"
        aria-label="Settings">
        ⚙
      </button>

    </section>


    <!-- ========================================
