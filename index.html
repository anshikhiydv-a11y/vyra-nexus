<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AV — AI Assistant</title>


  <style>

    /* =========================================
       AV — CORE UI v4.0
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {

      --bg: #02040d;

      --purple: #9b5cff;
      --purple2: #c66cff;

      --blue: #3e8cff;
      --cyan: #46dfff;

      --pink: #ed63ff;

      --green: #38e7a5;

      --text: #ffffff;
      --muted: #85859e;

      --panel:
        rgba(15, 16, 45, 0.82);

    }


    html,
    body {

      width: 100%;
      height: 100%;

      background:
        #02040d;

      color: var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;

    }


    body {

      position: relative;

      min-height: 100vh;

    }


    /* =========================================
       BACKGROUND
    ========================================= */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 50% 42%,
          rgba(102, 42, 255, 0.16),
          transparent 30%
        ),

        radial-gradient(
          circle at 50% 75%,
          rgba(40, 120, 255, 0.08),
          transparent 38%
        );

    }


    body::after {

      content: "";

      position: fixed;

      left: -20%;
      right: -20%;
      bottom: -130px;

      height: 260px;

      border-radius: 50%;

      background:

        radial-gradient(
          ellipse at center,
          rgba(100, 54, 255, 0.14),
          transparent 65%
        );

      filter: blur(15px);

      pointer-events: none;

    }


    /* =========================================
       APP
    ========================================= */

    .app {

      position: relative;

      width: 100%;
      height: 100%;

      max-width: 520px;

      margin: 0 auto;

      display: flex;

      flex-direction: column;

      padding:
        18px
        18px
        16px;

      z-index: 2;

    }


    /* =========================================
       TOP BAR
    ========================================= */

    .top-bar {

      position: relative;

      height: 86px;

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      flex-shrink: 0;

    }


    .top-button {

      width: 58px;
      height: 58px;

      border-radius: 50%;

      border:
        1px solid
        rgba(130, 112, 255, 0.30);

      background:
        radial-gradient(
          circle,
          rgba(31, 28, 69, 0.90),
          rgba(7, 8, 22, 0.95)
        );

      color: #d9d6ff;

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow:
        inset 0 0 20px
        rgba(91, 65, 255, 0.10),

        0 0 18px
        rgba(73, 55, 255, 0.08);

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    .top-button:active {

      transform: scale(0.94);

    }


    /* hamburger */

    .hamburger {

      display: flex;

      flex-direction: column;

      gap: 6px;

    }


    .hamburger span {

      display: block;

      width: 28px;
      height: 3px;

      border-radius: 5px;

      background:
        #d9d6ff;

      box-shadow:
        0 0 8px
        rgba(170, 150, 255, 0.35);

    }


    /* gear */

    .gear {

      font-size: 31px;

      line-height: 1;

    }


    /* =========================================
       AV TOP LOGO
    ========================================= */

    .top-brand {

      position: absolute;

      left: 50%;

      top: -8px;

      transform:
        translateX(-50%);

      display: flex;

      flex-direction: column;

      align-items: center;

      pointer-events: none;

    }


    .top-av {

      font-family:
        Arial Black,
        Arial,
        sans-serif;

      font-size: 54px;

      line-height: 0.9;

      font-weight: 900;

      font-style: italic;

      letter-spacing: -7px;

      padding-right: 7px;

      background:
        linear-gradient(
          135deg,
          #8c49ff,
          #c56cff 45%,
          #f18aff 70%,
          #6b8cff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      filter:
        drop-shadow(
          0 0 12px
          rgba(171, 91, 255, 0.45)
        );

    }


    .top-subtitle {

      margin-top: 7px;

      font-size: 9px;

      letter-spacing: 5px;

      color:
        #aaa8c2;

      white-space: nowrap;

    }


    /* =========================================
       CORE AREA
    ========================================= */

    .core-area {

      position: relative;

      flex: 1;

      min-height: 0;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* =========================================
       CORE
    ========================================= */

    .core {

      position: relative;

      width: min(
        78vw,
        340px
      );

      height: min(
        78vw,
        340px
      );

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* central glow */

    .core-glow {

      position: absolute;

      width: 78%;

      height: 78%;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(175, 92, 255, 0.38),
          rgba(87, 52, 255, 0.17) 42%,
          transparent 72%
        );

      filter: blur(22px);

      animation:
        glowPulse 3s
        ease-in-out infinite;

    }


    /* =========================================
       CORE RINGS
    ========================================= */

    .ring {

      position: absolute;

      border-radius: 50%;

      pointer-events: none;

    }


    .ring-outer {

      width: 100%;
      height: 100%;

      border:
        1px solid
        rgba(105, 80, 255, 0.25);

      border-top-color:
        rgba(170, 79, 255, 0.85);

      border-bottom-color:
        rgba(72, 208, 255, 0.70);

      animation:
        rotateCW 14s
        linear infinite;

    }


    .ring-outer-2 {

      width: 91%;
      height: 91%;

      border:
        1px solid
        rgba(64, 221, 255, 0.35);

      border-top-color:
        rgba(68, 220, 255, 0.95);

      border-left-color:
        rgba(126, 76, 255, 0.60);

      animation:
        rotateCCW 10s
        linear infinite;

    }


    .ring-middle {

      width: 78%;
      height: 78%;

      border:
        2px solid
        transparent;

      border-top-color:
        #48dfff;

      border-right-color:
        #8153ff;

      border-bottom-color:
        #c86aff;

      box-shadow:
        0 0 18px
        rgba(78, 196, 255, 0.45);

      animation:
        rotateCW 8s
        linear infinite;

    }


    .ring-inner {

      width: 64%;
      height: 64%;

      border:
        2px solid
        rgba(210, 100, 255, 0.72);

      box-shadow:
        0 0 15px
        rgba(190, 88, 255, 0.45),

        inset 0 0 20px
        rgba(155, 72, 255, 0.15);

      animation:
        coreBreath 3s
        ease-in-out infinite;

    }


    /* =========================================
       ORBIT DOTS
    ========================================= */

    .dot {

      position: absolute;

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background:
        #b86cff;

      box-shadow:
        0 0 12px
        #a75cff;

      z-index: 8;

    }


    .dot-1 {

      top: 28%;
      left: 24%;

    }


    .dot-2 {

      top: 34%;
      right: 20%;

    }


    .dot-3 {

      bottom: 25%;
      left: 30%;

    }


    .dot-4 {

      bottom: 20%;
      right: 31%;

    }


    .dot-5 {

      top: 48%;
      right: 9%;

      width: 7px;
      height: 7px;

    }


    .dot-6 {

      top: 51%;
      left: 10%;

    }


    /* =========================================
       CORE CENTER
    ========================================= */

    .core-center {

      position: relative;

      z-index: 10;

      width: 46%;
      height: 46%;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:

        radial-gradient(
          circle at 40% 30%,
          rgba(109, 70, 165, 0.95),
          rgba(39, 22, 75, 0.95) 52%,
          rgba(13, 10, 32, 0.98) 100%
        );

      border:
        2px solid
        rgba(202, 105, 255, 0.82);

      box-shadow:

        0 0 25px
        rgba(190, 88, 255, 0.48),

        0 0 65px
        rgba(102, 59, 255, 0.28),

        inset 0 0 35px
        rgba(178, 79, 255, 0.24);

      animation:
        coreBreath 3s
        ease-in-out infinite;

    }


    /*
       Stylized AV mark
       Similar angular appearance
       to the reference design.
    */

    .center-av {

      position: relative;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Arial Black,
        Arial,
        sans-serif;

      font-size: clamp(
        44px,
        13vw,
        64px
      );

      font-weight: 900;

      font-style: italic;

      letter-spacing: -8px;

      padding-right: 7px;

      transform:
        skewX(-7deg);

      background:

        linear-gradient(
          135deg,
          #ffffff 0%,
          #e4b9ff 22%,
          #bf68ff 52%,
          #8f54ff 75%,
          #ffffff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      filter:

        drop-shadow(
          0 0 7px
          rgba(255, 184, 255, 0.65)
        )

        drop-shadow(
          0 0 18px
          rgba(164, 79, 255, 0.70)
        );

    }


    /* =========================================
       STATE COLORS
    ========================================= */

    /*
      LISTENING = cyan / blue
    */

    .core[data-state="listening"]
    .ring-middle {

      border-top-color:
        #4ce7ff;

      border-right-color:
        #3d8bff;

      box-shadow:
        0 0 25px
        rgba(54, 211, 255, 0.75);

    }


    .core[data-state="listening"]
    .core-glow {

      background:

        radial-gradient(
          circle,
          rgba(50, 215, 255, 0.40),
          rgba(48, 100, 255, 0.18),
          transparent 72%
        );

    }


    /*
      THINKING = purple
    */

    .core[data-state="thinking"]
    .ring-middle {

      border-top-color:
        #c45cff;

      border-right-color:
        #744cff;

      border-bottom-color:
        #e45cff;

    }


    .core[data-state="thinking"]
    .ring-inner {

      animation:
        thinkingPulse
        1s
        ease-in-out
        infinite;

    }


    /*
      SPEAKING = purple + cyan
    */

    .core[data-state="speaking"]
    .ring-middle {

      border-top-color:
        #58e7ff;

      border-right-color:
        #b75cff;

      border-bottom-color:
        #ff67dc;

      animation-duration:
        3s;

    }


    .core[data-state="speaking"]
    .core-center {

      animation:
        speakingPulse
        0.8s
        ease-in-out
        infinite;

    }


    /*
      REVEAL = bright magenta
    */

    .core[data-state="reveal"] {

      transform:
        scale(1.08);

    }


    .core[data-state="reveal"]
    .ring-middle {

      border-top-color:
        #ff70ff;

      border-right-color:
        #b55cff;

      border-bottom-color:
        #ff9df5;

      box-shadow:
        0 0 35px
        rgba(255, 86, 244, 0.90);

    }


    .core[data-state="reveal"]
    .core-glow {

      background:

        radial-gradient(
          circle,
          rgba(255, 80, 242, 0.48),
          rgba(150, 65, 255, 0.24),
          transparent 72%
        );

    }


    /* =========================================
       STATUS
    ========================================= */

    .status-area {

      flex-shrink: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-height: 75px;

      margin-bottom: 8px;

    }


    .status {

      display: flex;

      align-items: center;

      gap: 10px;

      color:
        #dddbea;

      font-size: 15px;

      letter-spacing: 4px;

      font-weight: 500;

    }


    .status-dot {

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background:
        var(--green);

      box-shadow:
        0 0 12px
        rgba(56, 231, 165, 0.95);

    }


    .status-message {

      margin-top: 10px;

      color:
        #77778f;

      font-size: 13px;

      letter-spacing: 2px;

      text-align: center;

    }


    /* =========================================
       BOTTOM CONTROL BAR
    ========================================= */

    .controls {

      position: relative;

      flex-shrink: 0;

      height: 94px;

      border-radius: 50px;

      border:
        1px solid
        rgba(91, 86, 220, 0.45);

      background:

        linear-gradient(
          180deg,
          rgba(29, 31, 75, 0.78),
          rgba(12, 15, 43, 0.90)
        );

      box-shadow:

        inset 0 0 25px
        rgba(80, 66, 255, 0.12),

        0 0 25px
        rgba(57, 56, 255, 0.10);

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        10px 18px;

    }


    .control-button {

      width: 62px;
      height: 62px;

      border-radius: 50%;

      border:
        1px solid
        rgba(107, 105, 230, 0.32);

      background:
        rgba(28, 31, 77, 0.88);

      color:
        #d8d9ff;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    .control-button:active {

      transform:
        scale(0.92);

    }


    /* keyboard */

    .keyboard-icon {

      width: 30px;
      height: 23px;

      border:
        2px solid
        #cfd2ff;

      border-radius: 3px;

      position: relative;

    }


    .keyboard-icon::before {

      content:
        "••••••••";

      position: absolute;

      left: 4px;

      top: 1px;

      font-size: 12px;

      letter-spacing: 1px;

      color:
        #cfd2ff;

    }


    .keyboard-icon::after {

      content: "";

      position: absolute;

      left: 6px;
      right: 6px;
      bottom: 3px;

      height: 2px;

      background:
        #cfd2ff;

    }


    /* =========================================
       MAIN MIC
    ========================================= */

    .mic {

      position: relative;

      width: 78px;
      height: 78px;

      border-radius: 50%;

      border:
        2px solid
        rgba(218, 103, 255, 0.95);

      background:

        radial-gradient(
          circle,
          #5a1da0 0%,
          #29145c 48%,
          #100d2c 100%
        );

      color:
        white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 30px;

      cursor: pointer;

      box-shadow:

        0 0 15px
        rgba(193, 82, 255, 0.85),

        0 0 35px
        rgba(125, 61, 255, 0.48),

        inset 0 0 15px
        rgba(255, 120, 255, 0.20);

      transform:
        translateY(-2px);

      -webkit-tap-highlight-color:
        transparent;

    }


    .mic::before {

      content: "";

      position: absolute;

      inset: -7px;

      border-radius: 50%;

      border:
        1px solid
        rgba(190, 91, 255, 0.40);

      animation:
        micPulse 2s
        ease-in-out infinite;

    }


    .mic:active {

      transform:
        translateY(-2px)
        scale(0.92);

    }


    .mic-icon {

      position: relative;

      z-index: 2;

      font-size: 31px;

    }


    /* sliders */

    .sliders {

      position: relative;

      width: 28px;
      height: 30px;

    }


    .sliders span {

      position: absolute;

      left: 0;

      width: 28px;

      height: 2px;

      background:
        #cfd2ff;

      border-radius: 4px;

    }


    .sliders span:nth-child(1) {

      top: 5px;

    }


    .sliders span:nth-child(2) {

      top: 14px;

    }


    .sliders span:nth-child(3) {

      top: 23px;

    }


    .sliders i {

      position: absolute;

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background:
        #d9d9ff;

      box-shadow:
        0 0 6px
        rgba(170, 170, 255, 0.5);

    }


    .sliders i:nth-child(4) {

      top: 2px;
      left: 17px;

    }


    .sliders i:nth-child(5) {

      top: 11px;
      left: 7px;

    }


    .sliders i:nth-child(6) {

      top: 20px;
      left: 19px;

    }


    /* =========================================
       HIDDEN TEXT INPUT
       =========================================
       Keeps .command for app.js.
       We keep it available without showing
       the old large command box.
    ========================================= */

    .command {

      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;

    }


    .command input {

      width: 1px;
      height: 1px;

    }


    /* =========================================
       ANIMATIONS
    ========================================= */

    @keyframes rotateCW {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    @keyframes rotateCCW {

      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }

    }


    @keyframes coreBreath {

      0%,
      100% {

        transform:
          scale(0.97);

      }

      50% {

        transform:
          scale(1.03);

      }

    }


    @keyframes glowPulse {

      0%,
      100% {

        opacity:
          0.55;

        transform:
          scale(0.94);

      }

      50% {

        opacity:
          1;

        transform:
          scale(1.08);

      }

    }


    @keyframes thinkingPulse {

      0%,
      100% {

        transform:
          scale(0.95);

      }

      50% {

        transform:
          scale(1.08);

      }

    }


    @keyframes speakingPulse {

      0%,
      100% {

        transform:
          scale(0.96);

      }

      50% {

        transform:
          scale(1.06);

      }

    }


    @keyframes micPulse {

      0%,
      100% {

        transform:
          scale(0.95);

        opacity:
          0.35;

      }

      50% {

        transform:
          scale(1.08);

        opacity:
          0.8;

      }

    }


    /* =========================================
       SMALL PHONES
    ========================================= */

    @media (
      max-height: 680px
    ) {

      .app {

        padding-top: 10px;

      }


      .top-bar {

        height: 70px;

      }


      .top-button {

        width: 52px;
        height: 52px;

      }


      .top-av {

        font-size: 46px;

      }


      .core {

        width: min(
          70vw,
          290px
        );

        height: min(
          70vw,
          290px
        );

      }


      .status-area {

        min-height: 65px;

      }


      .controls {

        height: 84px;

      }


      .control-button {

        width: 55px;
        height: 55px;

      }


      .mic {

        width: 70px;
        height: 70px;

      }

    }


  </style>

</head>


<body>


  <main class="app">


    <!-- =====================================
         TOP BAR
    ====================================== -->

    <header class="t
      op-bar">

      <button
        class="top-button"
        type="button"
        aria-label="Menu"
      >
        <span class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>


      <div class="top-brand">

        <div class="top-av">
          AV
        </div>

        <div class="top-subtitle">
          AI ASSISTANT
        </div>

      </div>


      <button
        class="top-button"
        type="button"
        aria-label="Settings"
      >
        <span class="gear">⚙</span>
      </button>

    </header>


    <!-- =====================================
         CORE
    ====================================== -->

    <section class="core-area">

      <div
        class="core"
        id="avCore"
        data-state="standby"
        aria-label="AV Core"
      >

        <div class="core-glow"></div>

        <div class="ring ring-outer"></div>

        <div class="ring ring-outer-2"></div>

        <div class="ring ring-middle"></div>

        <div class="ring ring-inner"></div>


        <span class="dot dot-1"></span>
        <span class="dot dot-2"></span>
        <span class="dot dot-3"></span>
        <span class="dot dot-4"></span>
        <span class="dot dot-5"></span>
        <span class="dot dot-6"></span>


        <div class="core-center">

          <div class="center-av">
            AV
          </div>

        </div>

      </div>

    </section>


    <!-- =====================================
         STATUS
    ====================================== -->

    <section class="status-area">

      <div class="status">

        <span
          class="status-dot"
          id="statusDot"
        ></span>

        <span id="statusText">
          AV ONLINE
        </span>

      </div>


      <div
        class="status-message"
        id="statusMessage"
      >
        Listening for your command...
      </div>

    </section>


    <!-- =====================================
         BOTTOM CONTROL BAR
    ====================================== -->

    <section class="controls">


      <!-- KEYBOARD -->

      <button
        class="control-button"
        type="button"
        aria-label="Keyboard"
        id="keyboardButton"
      >

        <span class="keyboard-icon"></span>

      </button>


      <!-- MAIN MICROPHONE -->

      <button
        class="mic"
        type="button"
        aria-label="Tap to speak"
        id="mainMic"
      >

        <span class="mic-icon">
          🎙️
        </span>

      </button>


      <!-- SLIDERS -->

      <button
        class="control-button"
        type="button"
        aria-label="Controls"
      >

        <span class="sliders">

          <span></span>
          <span></span>
          <span></span>

          <i></i>
          <i></i>
          <i></i>

        </span>

      </button>

    </section>


    <!-- =====================================
         HIDDEN COMMAND INPUT
    ====================================== -->

    <section class="command">

      <input
        type="text"
        placeholder="Type your command..."
        aria-label="Command"
      >

      <button
        class="send"
        type="button"
        aria-label="Send message"
      >
        ➤
      </button>

    </section>

  </main>


  <!-- =====================================
       AV UI STATE CONTROLLER
  ====================================== -->

  <script>

    window.AV_UI = {

      setState: function (state) {

        state =
          String(state || "standby")
            .toLowerCase();


        const core =
          document.getElementById("avCore");

        const statusText =
          document.getElementById("statusText");

        const statusMessage =
          document.getElementById("statusMessage");

        const statusDot =
          document.getElementById("statusDot");


        if (!core) {
          return;
        }


        core.dataset.state = state;


        /* STANDBY */

        if (state === "standby") {

          if (statusText) {
            statusText.textContent =
              "AV ONLINE";
          }

          if (statusMessage) {
            statusMessage.textContent =
              "Listening for your command...";
          }

          if (statusDot) {
            statusDot.style.background =
              "#38e7a5";

            statusDot.style.boxShadow =
              "0 0 12px rgba(56,231,165,.95)";
          }

        }


        /* LISTENING */

        else if (state === "listening") {

          if (statusText) {
            statusText.textContent =
              "AV LISTENING";
          }

          if (statusMessage) {
            statusMessage.textContent =
              "I'm listening...";
          }

          if (statusDot) {
            statusDot.style.background =
              "#46dfff";

            statusDot.style.boxShadow =
              "0 0 14px rgba(70,223,255,.95)";
          }

        }


        /* THINKING */

        else if (state === "thinking") {

          if (statusText) {
            statusText.textContent =
              "AV THINKING";
          }

          if (statusMessage) {
            statusMessage.textContent =
              "Give me a moment...";
          }

          if (statusDot) {
            statusDot.style.background =
              "#b45cff";

            statusDot.style.boxShadow =
              "0 0 15px rgba(180,92,255,.95)";
          }

        }


        /* SPEAKING */

        else if (state === "speaking") {

          if (statusText) {
            statusText.textContent =
              "AV SPEAKING";
          }

          if (statusMessage) {
            statusMessage.textContent =
              "I'm speaking...";
          }

          if (statusDot) {
            statusDot.style.background =
              "#d968ff";

            statusDot.style.boxShadow =
              "0 0 15px rgba(217,104,255,.95)";
          }

        }


        /* REVEAL */

        else if (state === "reveal") {

          if (statusText) {
            statusText.textContent =
              "AV REVEAL";
          }

          if (statusMessage) {
            statusMessage.textContent =
              "Revealing...";
          }

          if (statusDot) {
            statusDot.style.background =
              "#ff6cff";

            statusDot.style.boxShadow =
              "0 0 18px rgba(255,108,255,1)";
          }

        }


        console.log(
          "AV UI STATE:",
          state
        );

      }

    };


    window.AV_UI.setState("standby");

  </script>
