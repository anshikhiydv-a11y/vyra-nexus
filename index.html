<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VYRA Nexus</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;

      margin: auto;

      display: flex;
      flex-direction: column;

      padding: 18px;
    }

    /* Header */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 12px 4px 20px;

      border-bottom: 1px solid #27304a;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      color: #65e6a6;
      font-size: 13px;
      white-space: nowrap;
    }

    /* Chat Area */

    .chat {
      flex: 1;

      display: flex;
      flex-direction: column;

      gap: 14px;

      padding: 25px 0;

      overflow-y: auto;
    }

    .message {
      background: #18213a;

      padding: 16px;

      border-radius: 16px;

      max-width: 85%;

      line-height: 1.5;

      word-wrap: break-word;
    }

    /* User Message */

    .user-message {
      background: #6d7cff;

      align-self: flex-end;

      text-align: left;
    }

    /* Input Area */

    .input-area {
      display: flex;

      align-items: center;

      gap: 8px;

      padding-top: 15px;

      padding-bottom: 10px;

      border-top: 1px solid #27304a;

      background: #0b1020;
    }

    input {
      flex: 1;

      min-width: 0;

      border: none;

      outline: none;

      padding: 15px;

      border-radius: 14px;

      font-size: 16px;

      background: #18213a;

      color: white;
    }

    input::placeholder {
      color: #9ba5c0;
    }

    button {
      border: none;

      border-radius: 14px;

      padding: 14px;

      font-size: 18px;

      cursor: pointer;
    }

    .send {
      background: #6d7cff;

      color: white;
    }

    .mic {
      background: #27304a;

      color: white;
    }

    /* Small Phone Screens */

    @media (max-width: 450px) {

      .app {
        padding: 14px;
      }

      .logo {
        font-size: 21px;
      }

      .status {
        font-size: 11px;
      }

      .message {
        max-width: 90%;
      }

    }

  </style>

</head>


<body>

  <main class="app">

    <!-- Header -->

    <header>

      <div class="logo">
        VYRA NEXUS
      </div>

      <div class="status">
        ● SYSTEM ONLINE
      </div>

    </header>


    <!-- Chat Area -->

    <section class="chat">

      <div class="message">

        Hello, Boss 👋

        <br><br>

        मैं VYRA Nexus हूँ।

        <br>

        मेरा Master AI Core
        और Chat Agent online हैं।

      </div>

    </section>


    <!-- Input Area -->

    <section class="input-area">

      <input
        type="text"
        placeholder="VYRA से कुछ पूछें..."
        aria-label="VYRA message"
      >

      <button
        class="mic"
        type="button"
        aria-label="Voice input"
      >
        🎤
      </button>

      <button
        class="send"
        type="button"
        aria-label="Send message"
      >
        ➤
      </button>

    </section>

  </main>


  <!-- VYRA AI System -->

  <script src="chat-agent.js"></script>

  <script src="master-core.js"></script>

  <script src="app.js"></script>


</body>

  </html>
