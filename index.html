<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AV — AI Assistant</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #02040c;

      --violet: #8d45ff;
      --purple: #b65cff;
      --pink: #e56cff;

      --blue: #3f7dff;
      --cyan: #35d9ff;

      --green: #27e6a5;

      --white: #ffffff;
      --muted: #9295b2;

      --glass: rgba(8, 12, 30, 0.72);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================================
       BACKGROUND
    ========================================= */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 38%,
          rgba(93, 55, 255, 0.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 75%,
          rgba(30, 120, 255, 0.09),
          transparent 42%
        );

      z-index: 0;
    }


    body::after {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          115deg,
          transparent 25%,
          rgba(86, 74, 255, 0.025),
          transparent 75%
        );

      z-index: 0;
    }


    /* =========================================
       MAIN APP
    ========================================= */

    .app {
      position: relative;
      z-index: 1;

      width: 100%;
      min-height: 100vh;

      max-width: 520px;

      margin: 0 auto;

      padding:
        16px
        16px
        calc(22px + env(safe-area-inset-bottom));
    }


    /* =========================================
       TOP BAR
    ========================================= */

    .topbar {
      height: 52px;

      display: grid;

      grid-template-columns: 48px 1fr 48px;

      align-items: center;

      position: relative;
      z-index: 20;
    }


    .top-button {
      width: 42px;
      height: 42px;

      border: 1px solid rgba(120, 115, 255, 0.18);

      border-radius: 50%;

      background:
        rgba(10, 13, 30, 0.62);

      color: #d9ddff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 21px;

      cursor: pointer;

      backdrop-filter: blur(10px);
    }


    .top-button:active {
      transform: scale(0.92);
    }


    .top-brand {
      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;
    }


    /* =========================================
       FUTURISTIC AV LOGO
    ========================================= */

    .av-logo {
      width: 62px;
      height: 34px;

      display: block;

      filter:
        drop-shadow(0 0 7px rgba(168, 85, 255, 0.75))
        drop-shadow(0 0 15px rgba(55, 150, 255, 0.35));
    }


    .brand-subtitle {
      margin-top: 1px;

      color: #9fa5d0;

      font-size: 7px;

      letter-spacing: 3px;

      font-weight: 600;
    }


    /* =========================================
       CORE STAGE
    ========================================= */

    .core-stage {
      position: relative;

      width: 100%;

      height: 480px;

      margin-top: 5px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;
    }


    /* soft center light */

    .stage-glow {
      position: absolute;

      width: 330px;
      height: 330px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(121, 56, 255, 0.22),
          rgba(36, 114, 255, 0.08) 40%,
          transparent 72%
        );

      filter: blur(18px);

      animation:
        stageBreath 4s ease-in-out infinite;
    }


    /* =========================================
       CORE
    ========================================= */

    .av-core {
      position: relative;

      width: 300px;
      height: 300px;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      user-select: none;
    }


    /* =========================================
       ENERGY RINGS
    ========================================= */

    .energy {
      position: absolute;

      border-radius: 50%;

      pointer-events: none;
    }


    .energy-one {
      width: 205px;
      height: 205px;

      border:
        2px solid transparent;

      border-top-color: var(--pink);
      border-right-color: var(--purple);

      box-shadow:
        0 0 12px rgba(221, 99, 255, 0.75),
        inset 0 0 8px rgba(155, 70, 255, 0.20);

      animation:
        spin 7s linear infinite;
    }


    .energy-two {
      width: 235px;
      height: 235px;

      border:
        2px solid transparent;

      border-left-color: var(--cyan);
      border-bottom-color: var(--blue);

      box-shadow:
        0 0 13px rgba(50, 170, 255, 0.65);

      animation:
        spinReverse 9s linear infinite;
    }


    .energy-three {
      width: 270px;
      height: 270px;

      border:
        1px solid transparent;

      border-top-color: rgba(70, 205, 255, 0.75);
      border-bottom-color: rgba(183, 77, 255, 0.72);

      opacity: 0.78;

      animation:
        spin 15s linear infinite;
    }


    .energy-four {
      width: 292px;
      height: 292px;

      border:
        1px solid rgba(106, 84, 255, 0.17);

      animation:
        slowSpin 25s linear infinite;
    }


    /* =========================================
       ENERGY SEGMENTS
    ========================================= */

    .energy-segment {
      position: absolute;

      border-radius: 50%;

      pointer-events: none;
    }


    .segment-a {
      width: 315px;
      height: 315px;

      border:
        2px solid transparent;

      border-top-color: rgba(105, 55, 255, 0.55);

      transform: rotate(35deg);

      animation:
        spinReverse 18s linear infinite;
    }


    .segment-b {
      width: 320px;
      height: 320px;

      border:
        2px solid transparent;

      border-bottom-color: rgba(45, 196, 255, 0.48);

      transform: rotate(-40deg);

      animation:
        spin 20s linear infinite;
    }


    /* =========================================
       CORE CENTER
    ========================================= */

    .core-center {
      position: relative;

      z-index: 10;

      width: 126px;
      height: 126px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 38% 30%,
          #493078,
          #160c32 62%,
          #090719 100%
        );

      border:
        2px solid rgba(205, 117, 255, 0.86);

      box-shadow:
        0 0 22px rgba(174, 81, 255, 0.80),
        0 0 55px rgba(93, 72, 255, 0.35),
        inset 0 0 28px rgba(155, 92, 255, 0.25);

      animation:
        corePulse 3.2s ease-in-out infinite;
    }


    /* =========================================
       CUSTOM AV MARK
    ========================================= */

    .core-logo {
      width: 78px;
      height: 52px;

      filter:
        drop-shadow(0 0 6px rgba(208, 115, 255, 0.75))
        drop-shadow(0 0 14px rgba(75, 154, 255, 0.35));
    }


    /* =========================================
       CORE PARTICLES
    ========================================= */

    .particle {
      position: absolute;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #b86cff;

      box-shadow:
        0 0 9px #9b5cff,
        0 0 16px rgba(80, 160, 255, 0.55);

      pointer-events: none;

      animation:
        particleFloat 4s ease-in-out infinite;
    }


    .p1 {
      left: 18%;
      top: 36%;
    }

    .p2 {
      right: 19%;
      top: 29%;

      animation-delay: 0.7s;
    }

    .p3 {
      left: 26%;
      bottom: 30%;

      animation-delay: 1.4s;
    }

    .p4 {
      right: 25%;
      bottom: 25%;

      animation-delay: 2.1s;
    }

    .p5 {
      left: 12%;
      top: 53%;

      animation-delay: 0.9s;
    }

    .p6 {
      right: 12%;
      top: 52%;

      animation-delay: 1.8s;
    }

    .p7 {
      left: 35%;
      top: 20%;

      animation-delay: 2.7s;
    }

    .p8 {
      right: 34%;
      bottom: 19%;

      animation-delay: 3.2s;
    }


    /* =========================================
       STATUS
    ========================================= */

    .ai-status {
      position: relative;
      z-index: 5;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      margin-top: -3px;

      color: #d4d6eb;

      font-size: 12px;

      letter-spacing: 2px;

      text-align: center;
    }


    .status-dot {
      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 7px var(--green),
        0 0 15px rgba(39, 230, 165, 0.55);

      animation:
        statusPulse 2s ease-in-out infinite;
    }


    .core-hint {
      margin-top: 9px;

      color: #737791;

      font-size: 11px;

      letter-spacing: 1px;

      text-align: center;
    }


    /* =========================================
       BOTTOM CONTROL DOCK
    ========================================= */

    .control-dock {
      position: relative;
      z-index: 10;

      width: 100%;

      max-width: 320px;

      height: 78px;

      margin:
        26px auto
        0;

      padding: 9px;

      display: grid;

      grid-template-columns: 1fr 1.35fr 1fr;

      align-items: center;

      border:
        1px solid rgba(93, 105, 255, 0.28);

      border-radius: 40px;

      background:
        linear-gradient(
          180deg,
          rgba(19, 25, 58, 0.82),
          rgba(7, 11, 28, 0.92)
        );

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35),
        inset 0 0 20px rgba(84, 91, 255, 0.07);

      backdrop-filter: blur(16px);
    }


    .dock-button {
      width: 48px;
      height: 48px;

      margin: auto;

      border:
        1px solid rgba(103, 112, 255, 0.18);

      border-radius: 50%;

      background:
        rgba(27, 35, 78, 0.65);

      color: #c7d0ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;

      cursor: pointer;
    }


    .dock-button:active {
      transform: scale(0.91);
    }


    /* =========================================
       MAIN MICROPHONE
    ========================================= */

    .mic {
      position: relative;

      width: 64px;
      height: 64px;

      margin: auto;

      border:
        2px solid rgba(203, 105, 255, 0.90);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #7440ff,
          #32126e 62%,
          #120923 100%
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;

      cursor: pointer;

      box-shadow:
        0 0 18px rgba(154, 72, 255, 0.75),
        0 0 40px rgba(78, 96, 255, 0.25);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }


    .mic::before {
      content: "";

      position: absolute;

      inset: -6px;

      border-radius: 50%;

      border:
        1px solid rgba(87, 159, 255, 0.30);

      animation:
        micPulse 2.4s ease-in-out infinite;
    }


    .mic:active {
      transform: scale(0.91);

      box-shadow:
        0 0 30px rgba(183, 85, 255, 0.95);
    }


    /* =========================================
       DESKTOP
    ========================================= */

    @media (min-width: 700px) {

      .app {
        max-width: 760px;

        padding-top: 24px;
      }

      .core-stage {
        height: 570px;
      }

      .av-core {
        transform: scale(1.18);
      }

      .control-dock {
        margin-top: 30px;
      }
    }


    /* =========================================
       ANIMATIONS
    ========================================= */

    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    @keyframes spinReverse {

      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }

    }


    @keyframes slowSpin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(-360deg);
      }

    }


    @keyframes corePulse {

      0%,
      100% {
        transform: scale(0.96);
      }

      50% {
        transform: scale(1.04);
      }

    }


    @keyframes stageBreath {

      0%,
      100% {
        transform: scale(0.88);
        opacity: 0.65;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }

    }


    @keyframes particleFloat {

      0%,
      100% {
        transform:
          translateY(0)
          scale(0.7);

        opacity: 0.35;
      }

      50% {
        transform:
          translateY(-15px)
          scale(1.25);

        opacity: 1;
      }

    }


    @keyframes statusPulse {

      0%,
      100% {
        transform: scale(0.8);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }

    }


    @keyframes micPulse {

      0%,
      100% {
        transform: scale(0.94);
        opacity: 0.35;
      }

      50% {
        transform: scale(1.08);
        opacity: 0.8;
      }

    }


    /* =========================================
       REDUCE MOTION
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }

    }

  </style>
</head>


<body>

  <main class="app">


    <!-- =====================================
         TOP BAR
    ====================================== -->

    <header class="topbar">

      <button
        class="top-button"
        type="button"
        aria-label="Menu"
      >
        ☰
      </button>


      <div class="top-brand">

        <!-- CUSTOM AV LOGO -->

        <svg
          class="av-logo"
          viewBox="0 0 160 90"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="AV"
        >

          <defs>

            <linearGradient
              id="topAVGradient"
              x1="0"
              y1="0"
              x2="1"
              y2="1"
            >

              <stop
                offset="0%"
                stop-color="#ffffff"
              />

              <stop
                offset="38%"
                stop-color="#bd67ff"
              />

              <stop
                offset="72%"
                stop-color="#8061ff"
              />

              <stop
                offset="100%"
                stop-color="#45d7ff"
              />

            </linearGradient>

          </defs>


          <!-- futuristic A -->

          <path
            d="M8 78 L43 10 L60 10 L91 78 L72 78 L64 59 L34 59 L26 78 Z
               M41 44 L57 44 L49 25 Z"
            fill="url(#topAVGradient)"
          />


          <!-- futuristic V -->

          <path
            d="M78 10 L97 10 L111 54 L126 10 L145 10 L119 78 L103 78 Z"
            fill="url(#topAVGradient)"
          />

        </svg>


        <div class="brand-subtitle">
          AI ASSISTANT
        </div>

      </div>


      <button
        class="top-button"
        type="button"
        aria-label="Settings"
      >
        ⚙
      </button>

    </header>


    <!-- =====================================
         AV CORE
    ====================================== -->

    <section
      class="core-stage"
      aria-label="AV Core"
    >

      <div class="stage-glow"></div>


      <div
        class="av-core"
        role="button"
        tabindex="0"
        aria-label="AV Core"
      >


        <!-- Energy -->

        <div class="energy energy-one"></div>

        <div class="energy energy-two"></div>

        <div class="energy energy-three"></div>

        <div class="energy energy-four"></div>

        <div class="energy-segment segment-a"></div>

        <div class="energy-segment segment-b"></div>


        <!-- Core center -->

        <div class="core-center">


          <!-- CUSTOM AV LOGO -->

          <svg
            class="core-logo"
            viewBox="0 0 160 90"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="AV Core"
          >

            <defs>

              <linearGradient
                id="coreAVGradient"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#ffffff"
                />

                <stop
                  offset="40%"
                  stop-color="#d27aff"
                />

                <stop
                  offset="72%"
                  stop-color="#9d67ff"
                />

                <stop
                  offset="100%"
                  stop-color="#49dfff"
                />

              </linearGradient>

            </defs>


            <path
              d="M8 78 L43 10 L60 10 L91 78 L72 78 L64 59 L34 59 L26 78 Z
                 M41 44 L57 44 L49 25 Z"
              fill="url(#coreAVGradient)"
            />


            <path
              d="M78 10 L97 10 L111 54 L126 10 L145 10 L119 78 L103 78 Z"
              fill="url(#coreAVGradient)"
            />

          </svg>

        </div>


        <!-- particles -->

        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>

      </div>

    </section>


    <!-- =====================================
         STATUS
    ====================================== -->

    <div class="ai-status card">

      <span class="status-dot"></span>

      <p>
        AV ONLINE
      </p>

    </div>


    <div class="core-hint">

      Listening for your command...

    </div>


    <!-- =====================================
         CONTROL DOCK
    ====================================== -->

    <section class="control-dock">


      <button
        class="dock-button"
        type="button"
        aria-label="Keyboard"
      >
        ⌨
      </button>


      <button
        class="mic"
        type="button"
        aria-label="Voice input"
      >
        🎙
      </button>


      <button
        class="dock-button"
        type="button"
        aria-label="Controls"
      >
        ☷
      </button>

    </section>


  </main>


  <!-- =====================================
       AV AGENTS
  ====================================== -->

  <script src="memory-agent.js"></script>

  <script src="chat-agent.js?v=3"></script>

  <script src="language-agent.js"></script>

  <script src="agents/story-agent.js"></script>

  <script src="master-core.js"></script>

  <script src="app.js"></script>


</body>

  </html>
